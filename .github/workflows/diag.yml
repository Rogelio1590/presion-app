name: Diag instalación
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bajar APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in build-3 build-5; do gh release download $t -D apks/$t -p '*.apk'; done
          : > diag/out.txt
      - name: Verificación estática
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "BT=$BT"
            for t in build-3 build-5; do
              f=$(ls apks/$t/*.apk); echo "######## $t $f $(stat -c %s $f)"
              "$BT/apksigner" verify -v --print-certs "$f"; echo "apksigner exit=$?"
              "$BT/zipalign" -c -P 16 4 "$f"; echo "zipalign16 exit=$?"
              "$BT/zipalign" -c 4 "$f"; echo "zipalign4 exit=$?"
              "$BT/aapt2" dump badging "$f" | grep -E "package|sdkVersion|native-code"
              unzip -l "$f" | grep -E "META-INF|\.so$|classes"
            done
          } >> diag/out.txt 2>&1 || true
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./diag/test.sh
      - name: Subir resultado
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f diag/out.txt; git commit -m "diag out [skip ci]"; git push
