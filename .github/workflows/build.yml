name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # La carpeta android/ se genera en cada build (no está en el repo).
      - name: Generar proyecto Android
        run: |
          flutter create --org com.rogelio --project-name presion_app --platforms android .
          sed -i 's/android:label="presion_app"/android:label="Presión"/' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      # Misma firma en todos los builds, así cada APK nuevo se instala
      # como actualización y no se pierden los datos.
      - name: Firma estable
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk presion-app-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: presion-app-${{ github.run_number }}
          path: presion-app-${{ github.run_number }}.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Presión — build ${{ github.run_number }}
          body: APK generado automáticamente desde ${{ github.sha }}.
          files: presion-app-${{ github.run_number }}.apk
          make_latest: true
