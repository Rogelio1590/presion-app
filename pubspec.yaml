name: presion_app
description: Registro de tomas de presión arterial con controles de 7 días, dashboard y exportación a Excel.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  excel: ^4.0.6
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# Ícono de la app (se aplica en CI con `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#C62828"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21
